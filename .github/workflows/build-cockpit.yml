name: Build MotoCockpit OS

on:
  push:
    paths:
      - 'cockpit/**'
      - 'config/**'
      - 'device/**'
      - 'scripts/**'
      - '.github/workflows/build-cockpit.yml'
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-motocockpit-os
  cancel-in-progress: false

jobs:
  build-os:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free Runner Disk Space
        run: |
          echo "[-] Freeing runner disk space..."
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af || true
          df -h

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          package_json_file: cockpit/package.json

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cockpit/pnpm-lock.yaml

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 platforms;android-36 build-tools;37.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Tooling Dependencies for ROM Reshaping
        run: |
          sudo apt-get update -y
          sudo apt-get install -y erofs-utils e2fsprogs android-sdk-libsparse-utils curl zip jq
          # Install payload-dumper-go
          curl -sL "https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin

      - name: Install Cockpit dependencies
        working-directory: cockpit
        run: pnpm install --frozen-lockfile

      - name: Prebuild Cockpit Android (CNG)
        working-directory: cockpit
        run: |
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npx expo prebuild --platform android --clean

      - name: Build signed release APK
        working-directory: cockpit/android
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/cockpit/credentials/release.keystore
          RELEASE_STORE_PASSWORD: Pillion_c7f0c1ca5b2dfcde602c
          RELEASE_KEY_ALIAS: pillion-release
          RELEASE_KEY_PASSWORD: Pillion_c7f0c1ca5b2dfcde602c
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          GRADLE_OPTS: -Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=true
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Stage Cockpit APK for Reshaping Pipeline
        run: |
          mkdir -p build_workdir/prebuilt
          APK_FILE=$(find cockpit/android/app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No signed release APK found."
            exit 1
          fi
          echo "[+] Staging $APK_FILE to build_workdir/prebuilt/Cockpit.apk"
          cp "$APK_FILE" build_workdir/prebuilt/Cockpit.apk
          ls -lh build_workdir/prebuilt/Cockpit.apk

      - name: Run ROM Reshaping Pipeline
        run: |
          chmod +x ./scripts/reshape.sh
          ./scripts/reshape.sh

      - name: Verify Output Artifacts
        run: |
          ls -lh out/
          cat out/*.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$(date +'%Y.%m.%d-%H%M')"
          RELEASE_TITLE="MotoCockpit OS ${TAG_NAME}"
          NOTES="### MotoCockpit OS for Motorola Moto G52 (rhode)
          
          * **Base:** Official LineageOS 24.0 (Android 17, SDK 37)
          * **Appliance Launcher:** Embedded Cockpit Receiver as default system HOME (zero setup wizard)
          * **Thermal & Hardware Tuning:** 60Hz AMOLED lock, cellular modem disabled (Wi-Fi/Bluetooth only), LMKD foreground priority
          * **Aggressively Debloated:** SetupWizard, Trebuchet, Telephony/SMS bloat, Aperture camera, and Lineage updater purged.
          
          #### Installation (Fastboot):
          1. Extract the downloaded \`MotoCockpit-OS-v1.0.0-rhode.zip\`.
          2. Connect Motorola Moto G52 in Bootloader mode (\`adb reboot bootloader\` or Volume Down + Power).
          3. Run \`./flash-all.sh\` (Mac/Linux) or \`flash-all.bat\` (Windows).
          4. Device will automatically flash partitions, wipe userdata, and boot directly into Cockpit."

          gh release create "${TAG_NAME}" out/*.zip out/*.sha256 build_workdir/prebuilt/Cockpit.apk \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}"
