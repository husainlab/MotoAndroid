name: Build MotoCockpit OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-motocockpit-os
  cancel-in-progress: false

jobs:
  build-os:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free Runner Disk Space
        run: |
          echo "[-] Freeing runner disk space..."
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af || true
          df -h

      - name: Install Tooling Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y erofs-utils e2fsprogs android-sdk-libsparse-utils curl zip jq
          # Install payload-dumper-go
          curl -sL "https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin

      - name: Run ROM Reshaping Pipeline
        run: |
          chmod +x ./scripts/reshape.sh
          ./scripts/reshape.sh

      - name: Verify Output Artifacts
        run: |
          ls -lh out/
          cat out/*.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$(date +'%Y.%m.%d-%H%M')"
          RELEASE_TITLE="MotoCockpit OS ${TAG_NAME}"
          NOTES="### MotoCockpit OS for Motorola Moto G52 (rhode)
          
          * **Base:** Official LineageOS Android 14 / 21
          * **Embedded Cockpit:** Cockpit Receiver Appliance
          * **Hardware Tuning:** 60Hz AMOLED lock, 3GB zstd ZRAM, Wi-Fi & Bluetooth-only mode
          * **Debloated:** All telephony/SMS bloat, Aperture camera, Eleven music, and stock trackers removed.
          
          #### Installation:
          1. Extract the downloaded \`MotoCockpit-OS-*.zip\`.
          2. Reboot Moto G52 into Fastboot mode (\`adb reboot bootloader\`).
          3. Run \`./flash-all.sh\` (Mac/Linux) or \`flash-all.bat\` (Windows)."

          gh release create "${TAG_NAME}" out/*.zip out/*.sha256 \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}"

